# Shared config for the 3 cluster nodes. SERVER_NAME comes from the environment of each container.
server_name: $SERVER_NAME
listen: 0.0.0.0:4222
http_port: 8222

jetstream {
  store_dir: /data
  max_memory_store: 128MB
  max_file_store: 1GB
}

cluster {
  name: example-cluster
  listen: 0.0.0.0:6222
  # Each node lists all three; a node ignores the route to itself.
  routes: [
    nats-route://nats-1:6222
    nats-route://nats-2:6222
    nats-route://nats-3:6222
  ]
}
