# NATS with JetStream, userpass auth with per-user permissions, and TLS.
# Same model as a typical production setup. Passwords are read from the environment
# (example/.env), never written here. Certificates come from gen-certs.sh.
server_name: auth-1
listen: 0.0.0.0:4222
http_port: 8222

tls {
  cert_file: /certs/server-cert.pem
  key_file: /certs/server-key.pem
  timeout: 2
}

jetstream {
  store_dir: /data
  max_memory_store: 128MB
  max_file_store: 1GB
}

authorization {
  users: [
    # Full access, for administration.
    { user: admin, password: $ADMIN_PASSWORD }

    # An application: publish/subscribe only in its own namespace, plus replies and JetStream API.
    {
      user: app
      password: $APP_PASSWORD
      permissions: {
        publish: { allow: ["app.>", "$JS.API.>"] }
        subscribe: { allow: ["app.>", "_INBOX.>"] }
      }
    }

    # Read-only: may subscribe to everything, may not publish anything. Use this one in the WebUI.
    {
      user: monitor
      password: $MONITOR_PASSWORD
      permissions: {
        publish: { deny: [">"] }
        subscribe: { allow: [">"] }
      }
    }
  ]
}
